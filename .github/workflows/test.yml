name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cada cambio pasa por lo mismo que se revisa a mano: lint, tipos, pruebas y
# compilacion de produccion. Si algo falla, no se publica.
jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores de mentira: la compilacion no se conecta a nada.
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-publica-de-prueba
      # Vercel corre en UTC: las pruebas tambien, para que una fecha de
      # Colombia mal calculada falle aqui y no en produccion.
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias (exactas, del lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Auditoria de dependencias de produccion
        run: npm audit --omit=dev --audit-level=high

      - name: Compilacion de produccion
        run: npm run build
